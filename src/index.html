<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品展示頁面</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body id="app" v-cloak @click="handleDocumentClick">
    <div class="container">
        <div class="header">
            <h1>精品商店</h1>
            <div class="cart-icon" role="button" tabindex="0" @click.stop="toggleCart" @keydown.enter="toggleCart" @keydown.space.prevent="toggleCart">
                🛒 購物車
                <div class="cart-count" id="cartCount">{{ cartTotalQuantity }}</div>
            </div>
        </div>

        <div class="search-container">
            <label class="search-label" for="productSearch">搜尋商品</label>
            <input class="search-input" id="productSearch" type="search" placeholder="輸入商品名稱" v-model="searchKeyword">
        </div>
        
        <div class="loading" id="loading" v-show="isLoading">載入中...</div>
        
        <div class="products-grid" id="productsGrid">
            <div class="product-card" v-for="product in filteredProducts" :key="product.id">
                <div class="product-image">圖片載入中...</div>
                <div class="product-title">{{ product.name }}</div>
                <div class="product-price">NT$ {{ product.price }}</div>
                <button class="add-to-cart-btn" type="button" @click="addToCart(product)">加入購物車</button>
            </div>
            <p class="no-results" v-if="!isLoading && products.length && !filteredProducts.length">找不到符合的商品</p>
        </div>
    </div>
    
    <!-- 購物車側邊欄 -->
    <div class="cart-sidebar" id="cartSidebar" :class="{ open: isCartOpen }">
        <div class="cart-header">
            <h2>購物車</h2>
            <button class="close-cart" type="button" @click="toggleCart">×</button>
        </div>
        <div id="cartItems">
            <p class="cart-empty" v-if="!cart.length">購物車是空的</p>
            <div class="cart-item" v-for="item in cart" :key="item.product.id">
                <div class="cart-item-image">圖片</div>
                <div class="cart-item-details">
                    <div class="cart-item-title">{{ item.product.name }}</div>
                    <div class="cart-item-price">NT$ {{ item.product.price }}</div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" type="button" @click="updateQuantity(item.product.id, -1)">-</button>
                        <input class="quantity-display" type="number" min="1" step="1" :value="item.quantity" :aria-label="item.product.name + ' 數量'" @change="setQuantity(item.product.id, $event.target.value)">
                        <button class="quantity-btn" type="button" @click="updateQuantity(item.product.id, 1)">+</button>
                    </div>
                    <button class="remove-item-btn" type="button" @click="removeFromCart(item.product.id)">移除</button>
                </div>
            </div>
        </div>
        <div class="cart-total">
            <div class="total-price">總計: NT$ <span id="totalPrice">{{ cartTotal }}</span></div>
            <div class="total-quantity">商品數量: <span id="totalQuantity">{{ cartTotalQuantity }}</span></div>
            <button class="checkout-btn" type="button" @click="checkout">結帳</button>
        </div>
    </div>

    <div class="notification" id="notification" role="status" aria-live="polite" :class="{ show: notificationVisible }">{{ notificationMessage }}</div>

    <div class="dialog-overlay" id="confirmationDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogMessage" :class="{ open: pendingAction }" @click.self="closeConfirmationDialog">
        <div class="dialog-window">
            <h2 id="dialogTitle">{{ dialogTitle }}</h2>
            <p id="dialogMessage">{{ dialogMessage }}</p>
            <div class="dialog-actions">
                <button class="dialog-btn dialog-cancel-btn" type="button" @click="closeConfirmationDialog">取消</button>
                <button class="dialog-btn dialog-confirm-btn" ref="dialogConfirmButton" type="button" @click="confirmDialogAction">確認</button>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/vue@3.5.43/dist/vue.global.prod.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
